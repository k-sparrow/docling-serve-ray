schemaVersion: "2.0.0"

fileExistenceTests:
  - name: "serve entrypoint binary exists"
    path: "/src/facade/serve"
    shouldExist: true

  - name: "app source is baked in"
    path: "/src/facade/serve.runfiles/_main/src/facade/main.py"
    shouldExist: true

  - name: "fastapi dependency closure is baked in"
    path: "/src/facade/serve.runfiles/rules_python++pip+pip_312_fastapi/__init__.py"
    shouldExist: true

  - name: "uvicorn dependency closure is baked in"
    path: "/src/facade/serve.runfiles/rules_python++pip+pip_312_uvicorn/__init__.py"
    shouldExist: true

metadataTest:
  entrypoint: ["/src/facade/serve"]
