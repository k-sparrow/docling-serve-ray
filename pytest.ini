[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: hits a real container (docker SDK / testcontainers), no network beyond localhost. < 2 min/suite.
    e2e: spins up the full docker-compose stack. Happy path only, not run per-PR.
    local: requires host-path Docker volume mounts / shells out to `docker compose`; incompatible with Bazel's sandbox, run with `tags = ["local"]`.
testpaths = facade/tests tests patches
