# Thin reverse proxy in front of docling-serve. Only the routes that need
# rewriting go to the facade (multipart uploads that would otherwise embed
# file bytes into Redis, and the shared /v1/result reconciliation endpoint);
# everything else -- including /v1/convert/source/batch, which is already
# byte-free -- passes straight through to docling-serve unmodified. See
# docling-serve-ray-facade-design in project memory for the full routing
# rationale.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    upstream docling_serve {
        server docling-serve:5001;
    }

    upstream facade {
        server facade:8000;
    }

    server {
        listen 5001;

        location = /v1/convert/file {
            proxy_pass http://facade;
        }

        location = /v1/convert/file/async {
            proxy_pass http://facade;
        }

        location ~ ^/v1/result/ {
            proxy_pass http://facade;
        }

        location / {
            proxy_pass http://docling_serve;
        }
    }
}
