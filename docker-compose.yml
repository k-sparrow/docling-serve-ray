services:
  minio:
    # Chainguard's from-source MinIO build, pinned by digest. MinIO's own
    # images stopped being publicly pullable around 2026-09-25 (quay.io/minio/*
    # now 401s anonymous pulls, Docker Hub's minio/* repos no longer exist),
    # which broke every Docker-dependent CI run. Chainguard's free tier only
    # publishes :latest, so this digest may eventually stop resolving and need
    # a bump. Runs as uid 65532, not root -- see README for the one-time
    # chown an existing root-owned minio-data volume needs.
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      # For the healthcheck below -- mc reads alias credentials from env.
      MC_HOST_local: http://minioadmin:minioadmin123@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # No curl in the Chainguard image; its bundled mc does the readiness
      # probe instead.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # Same image as `minio` -- it bundles mc, so no separate client image (and
    # no second registry dependency) is needed just to create two buckets.
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/docling-input local/docling-output &&
      exit 0
      "

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ray-head:
    # Built via `bazel run //src/patches/docling_serve:tarball`
    # (rules_oci, base image pinned by digest in MODULE.bazel) -- run that
    # before `docker compose up`. Containerfile remains as a plain-docker
    # fallback that produces the same fix under a different tag.
    image: docling-serve-ray-patched:v1.36.0-bazel
    command: >
      ray start --head --port=6379 --dashboard-host=0.0.0.0
      --num-cpus=0 --block
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      RAY_LOG_TO_STDERR: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ray", "health-check", "--address=127.0.0.1:6379"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  ray-worker:
    image: docling-serve-ray-patched:v1.36.0-bazel
    command: >
      ray start --address=ray-head:6379 --num-cpus=4 --block
    shm_size: "8gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      RAY_LOG_TO_STDERR: "1"
      RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
      AWS_CONFIG_FILE: /opt/app-root/src/.aws-minio-config
      AWS_SDK_LOAD_CONFIG: "1"
    volumes:
      - ./aws-minio-config:/opt/app-root/src/.aws-minio-config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      ray-head:
        condition: service_healthy

  docling-serve:
    image: docling-serve-ray-patched:v1.36.0-bazel
    # No published host port -- nginx is the public entrypoint now (see the
    # `nginx` service below). Reach this directly only via the docker network.
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      DOCLING_SERVE_ENABLE_UI: "true"

      # Engine selection
      DOCLING_SERVE_ENG_KIND: "ray"

      # Cluster connection
      DOCLING_SERVE_ENG_RAY_ADDRESS: "ray://ray-head:10001"
      DOCLING_SERVE_ENG_RAY_NAMESPACE: "docling"
      DOCLING_SERVE_ENG_RAY_REDIS_URL: "redis://redis:6379/"

      # Autoscaling: pinned to exactly 1 warm converter replica (10GB VRAM budget)
      DOCLING_SERVE_ENG_RAY_MIN_ACTORS: "1"
      DOCLING_SERVE_ENG_RAY_MAX_ACTORS: "1"
      DOCLING_SERVE_ENG_RAY_CONVERTER_ACTOR_NUM_CPUS: "2"

      # Concurrency: 2 slices in flight per replica, matched at the per-tenant dispatch gate
      DOCLING_SERVE_ENG_RAY_MAX_ONGOING_REQUESTS_PER_REPLICA: "2"
      DOCLING_SERVE_ENG_RAY_MAX_CONCURRENT_TASKS: "2"

      # PDF page-slice fan-out (off by default upstream — must opt in explicitly)
      DOCLING_SERVE_ENG_RAY_ENABLE_PDF_PAGE_SLICE_FANOUT: "true"
      DOCLING_SERVE_ENG_RAY_MAX_PAGE_SLICE_SIZE: "10"

      # Long-running conversions. Upstream's defaults (1h task / 5min document)
      # truncate heavy PDFs mid-flight -- observed, not theoretical; large
      # documents on this stack run up to ~6h. Matches the 24h ceiling Artemis
      # already sets in deployment/docker/docker-compose.dev.yaml.
      DOCLING_SERVE_ENG_RAY_TASK_TIMEOUT: "86400.0"
      DOCLING_SERVE_ENG_RAY_DOCUMENT_TIMEOUT: "86400.0"
      # Result-fetch window, applied at store time (redis.setex on the result
      # key), i.e. how long after completion a result stays retrievable -- NOT
      # a mid-flight expiry. The 4h default is shorter than a single heavy job,
      # and shorter than the facade's own 7-day record TTL
      # (FACADE_RECORD_TTL_SECONDS), so /v1/result would 404 while the converted
      # documents still sit in the output bucket. Raised to match the facade.
      DOCLING_SERVE_ENG_RAY_RESULTS_TTL: "604800"

      # Active backpressure: reject rather than queue unboundedly. Required to
      # make the QueueLimitExceededError -> 429 handler in
      # src/patches/docling_serve/app.py actually reachable -- both settings
      # default off/None, so without them that patch is inert.
      # NOTE the var name is MAX_QUEUED_TASKS, not DEFAULT_MAX_QUEUED_TASKS;
      # the wrong name is silently accepted (extra="allow") and the limit
      # then never enforces. Verified live that this name binds.
      # Depth sized against THIS box, not Artemis's 50: 2 concurrent slots
      # (MAX_CONCURRENT_TASKS) x ~6h worst-case heavy PDF means a depth of 8
      # already implies a ~24h wait at the back of the queue. 50 would mean
      # ~150h -- accepting work that will not start for a week.
      DOCLING_SERVE_ENG_RAY_MAX_QUEUED_TASKS: "8"
      DOCLING_SERVE_ENG_RAY_ENABLE_QUEUE_LIMIT_REJECTION: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      ray-head:
        condition: service_healthy
      redis:
        condition: service_healthy

  facade:
    # Built via `bazel run //src/facade:tarball` (rules_oci, same pattern as
    # ray-head/ray-worker/docling-serve). Containerfile fallback:
    # `docker build -f src/facade/Containerfile -t docling-serve-ray-facade .`
    image: docling-serve-ray-facade:latest
    environment:
      FACADE_DOCLING_SERVE_URL: "http://docling-serve:5001"
      FACADE_REDIS_URL: "redis://redis:6379/1"
      FACADE_S3_ENDPOINT: "minio:9000"
      FACADE_S3_VERIFY_SSL: "false"
      FACADE_S3_ACCESS_KEY: "minioadmin"
      FACADE_S3_SECRET_KEY: "minioadmin123"
      FACADE_S3_INPUT_BUCKET: "docling-input"
      FACADE_S3_OUTPUT_BUCKET: "docling-output"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      docling-serve:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    # Built via `bazel run //src/nginx:tarball` (rules_oci, nginx.conf baked into
    # the image -- same pattern as ray-head/ray-worker/docling-serve/facade).
    image: docling-serve-ray-nginx:latest
    ports:
      - "5001:5001"
    depends_on:
      docling-serve:
        condition: service_healthy
      facade:
        condition: service_healthy

volumes:
  redis-data:
  minio-data:
