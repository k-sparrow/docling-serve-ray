schemaVersion: "2.0.0"

fileExistenceTests:
  - name: "nginx.conf is baked into the image"
    path: "/etc/nginx/nginx.conf"
    shouldExist: true

fileContentTests:
  - name: "nginx.conf routes the facade-owned paths"
    path: "/etc/nginx/nginx.conf"
    expectedContents:
      - "location = /v1/convert/file "
      - "location = /v1/convert/file/async "
      - "location ~ \\^/v1/result/ "
      - "proxy_pass http://facade;"
      - "proxy_pass http://docling_serve;"

commandTests:
  - name: "nginx binary is present and runnable"
    command: "nginx"
    args: ["-v"]
    exitCode: 0
